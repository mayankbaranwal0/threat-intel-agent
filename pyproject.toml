[project]
name = "threat-intel-agent"
version = "0.1.0"
description = "Conversational threat-intelligence agent for SOC analysts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
tia = "threat_intel_agent.interfaces.cli:main"
tia-web = "threat_intel_agent.interfaces.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: needs LLM API key; skipped in CI"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["W", "I"]
